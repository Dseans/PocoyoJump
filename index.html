<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pocoyo's Sunny Adventure</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --poco-blue: #2AAAE2;
    --poco-blue-dark: #1584B8;
    --poco-orange: #F7941D;
    --poco-yellow: #FFD100;
    --poco-pink: #F4739E;
    --poco-purple: #9B6FD1;
    --poco-green: #8DC63F;
    --cream: #FFF7E6;
    --ink: #2B2340;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #1B2436;
    font-family: 'Baloo 2', 'Arial Rounded MT Bold', Verdana, sans-serif;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  #screen-wrap {
    position: absolute;
    inset: 0;
    width: 100vw;
    height: 100vh;
    background: #1B2436;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas#game {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    image-rendering: auto;
  }
  #touch-controls {
    position: absolute;
    bottom: 20px;
    left: 0;
    right: 0;
    padding: 0 24px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    pointer-events: none;
    z-index: 10;
  }
  .tbtn-group {
    display: flex;
    gap: 12px;
    pointer-events: auto;
  }
  .tbtn {
    width: 64px;
    height: 64px;
    border-radius: 20px;
    background: rgba(255,255,255,0.55);
    border: 3px solid var(--poco-blue-dark);
    color: var(--poco-blue-dark);
    font-size: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 0 rgba(21,132,184,0.5), 0 4px 10px rgba(0,0,0,0.15);
    pointer-events: auto;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
    transition: transform 0.05s;
  }
  .tbtn:active {
    background: rgba(255,255,255,0.85);
    transform: translateY(3px);
    box-shadow: 0 1px 0 rgba(21,132,184,0.5), 0 2px 6px rgba(0,0,0,0.15);
  }
  .tbtn.small {
    width: 44px;
    height: 44px;
    font-size: 16px;
    border-radius: 14px;
    background: rgba(255,255,255,0.4);
    border-color: rgba(43,35,64,0.35);
    color: var(--ink);
    box-shadow: 0 3px 0 rgba(43,35,64,0.25), 0 3px 8px rgba(0,0,0,0.12);
  }
  #btn-jump {
    width: 84px;
    height: 84px;
    border-radius: 50%;
    background: rgba(255,209,0,0.55);
    border: 3px solid var(--poco-orange);
    color: #7a4b00;
    font-size: 28px;
    box-shadow: 0 5px 0 rgba(247,148,29,0.55), 0 5px 12px rgba(0,0,0,0.18);
  }
  #btn-jump:active {
    background: rgba(255,209,0,0.85);
    transform: translateY(4px);
    box-shadow: 0 1px 0 rgba(247,148,29,0.55), 0 2px 8px rgba(0,0,0,0.15);
  }

  /* Portrait Game Boy layout */
  .controls-landscape { display: contents; }
  .controls-portrait { display: none; }

  @media (orientation: portrait) {
    html, body {
      height: 100%;
    }
    body {
      flex-direction: column;
      justify-content: flex-start;
    }
    #screen-wrap {
      position: relative;
      flex: 1 1 auto;
      width: 100%;
      height: auto;
      min-height: 0;
      inset: auto;
      background: #111;
    }
    canvas#game {
      width: 100%;
      height: auto;
      max-height: 100%;
      aspect-ratio: 16 / 9;
      object-fit: contain;
    }
    #touch-controls {
      position: relative;
      flex: 0 0 auto;
      width: 100%;
      min-height: 42vh;
      max-height: 48vh;
      padding: 0;
      pointer-events: auto;
      background: linear-gradient(180deg, #1a8ec4 0%, #0f6a9a 100%);
      border-top: 3px solid rgba(255,255,255,0.08);
      box-shadow: inset 0 2px 0 rgba(255,255,255,0.06);
    }
    .controls-landscape { display: none; }
    .controls-portrait {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      padding: 10px 16px 18px;
      gap: 8px;
    }
    .gb-brand {
      text-align: center;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.28em;
      color: rgba(255,255,255,0.45);
      flex: 0 0 auto;
    }
    .gb-main {
      flex: 1 1 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 8px;
      min-height: 0;
    }
    .gb-dpad {
      position: relative;
      width: 132px;
      height: 56px;
      flex: 0 0 auto;
    }
    .gb-dpad-shell {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .gb-dpad-arm {
      position: absolute;
      background: linear-gradient(180deg, #d8d4cc 0%, #b8b4ac 100%);
      box-shadow: 0 4px 0 #8a8680, inset 0 1px 0 rgba(255,255,255,0.55);
    }
    .gb-dpad-arm.h {
      left: 0;
      right: 0;
      top: 0;
      height: 56px;
      border-radius: 8px;
    }
    .dpad-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 0;
      height: 0;
      pointer-events: none;
      z-index: 1;
    }
    .dpad-arrow-l {
      left: 16px;
      border-top: 9px solid transparent;
      border-bottom: 9px solid transparent;
      border-right: 14px solid #5a5650;
      filter: drop-shadow(0 1px 0 rgba(255,255,255,0.35));
    }
    .dpad-arrow-r {
      right: 16px;
      border-top: 9px solid transparent;
      border-bottom: 9px solid transparent;
      border-left: 14px solid #5a5650;
      filter: drop-shadow(0 1px 0 rgba(255,255,255,0.35));
    }
    .dpad-notch {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 14px;
      height: 14px;
      margin: -7px 0 0 -7px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #b0aca4, #888480);
      box-shadow: inset 0 2px 3px rgba(0,0,0,0.22);
      pointer-events: none;
      z-index: 1;
    }
    .dpad-hit {
      position: absolute;
      border: none;
      background: transparent;
      pointer-events: auto;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      z-index: 2;
    }
    .dpad-left  { left: 0;  top: 0; width: 44px; height: 56px; }
    .dpad-right { right: 0; top: 0; width: 44px; height: 56px; }
    .gb-face {
      position: relative;
      width: 130px;
      height: 130px;
      flex: 0 0 auto;
      margin-right: 4px;
    }
    .gb-face-btn {
      position: absolute;
      width: 58px;
      height: 58px;
      border: none;
      border-radius: 50%;
      background: linear-gradient(180deg, #d8d4cc 0%, #b8b4ac 100%);
      color: #3a3840;
      font-family: inherit;
      font-size: 22px;
      font-weight: 800;
      box-shadow: 0 4px 0 #8a8680, inset 0 1px 0 rgba(255,255,255,0.55);
      pointer-events: auto;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .gb-face-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #8a8680, inset 0 1px 0 rgba(255,255,255,0.35);
    }
    .gb-a { right: 0; top: 8px; }
    .gb-b { left: 8px; bottom: 8px; }
    .gb-system {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 28px;
      flex: 0 0 auto;
      padding-top: 2px;
    }
    .gb-sys-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      border: none;
      background: transparent;
      pointer-events: auto;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      padding: 0;
    }
    .gb-sys-pill {
      width: 52px;
      height: 16px;
      border-radius: 999px;
      background: linear-gradient(180deg, #d8d4cc 0%, #b8b4ac 100%);
      box-shadow: 0 2px 0 #8a8680, inset 0 1px 0 rgba(255,255,255,0.55);
      transform: rotate(-18deg);
    }
    .gb-sys-btn:active .gb-sys-pill {
      transform: rotate(-18deg) translateY(2px);
      box-shadow: 0 0 0 #8a8680, inset 0 1px 0 rgba(255,255,255,0.35);
    }
    .gb-sys-label {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: rgba(255,255,255,0.72);
    }
    .gb-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex: 0 0 auto;
      padding: 0 4px;
    }
    .gb-menu-dot {
      width: 28px;
      height: 28px;
      border: none;
      border-radius: 50%;
      background: linear-gradient(180deg, #d8d4cc 0%, #b8b4ac 100%);
      box-shadow: 0 2px 0 #8a8680;
      pointer-events: auto;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      font-size: 14px;
      color: #3a3840;
    }
    .gb-menu-dot:active {
      transform: translateY(2px);
      box-shadow: 0 0 0 #8a8680;
    }
  }
</style>
</head>
<body>

<div id="screen-wrap">
  <canvas id="game" width="480" height="270"></canvas>
</div>

<div id="touch-controls">
  <div class="controls-landscape">
    <div class="tbtn-group">
      <div class="tbtn" id="btn-left">◀</div>
      <div class="tbtn" id="btn-right">▶</div>
    </div>
    <div class="tbtn-group" style="margin-bottom: 10px;">
      <div class="tbtn small" id="btn-pause">⏸</div>
      <div class="tbtn small" id="btn-mute">🔊</div>
    </div>
    <div class="tbtn" id="btn-jump">▲</div>
  </div>

  <div class="controls-portrait">
    <div class="gb-brand">POCOYO</div>
    <div class="gb-main">
      <div class="gb-dpad">
        <button type="button" class="dpad-hit dpad-left" id="btn-left-p" aria-label="Left"></button>
        <button type="button" class="dpad-hit dpad-right" id="btn-right-p" aria-label="Right"></button>
        <div class="gb-dpad-shell">
          <div class="gb-dpad-arm h"></div>
          <span class="dpad-arrow dpad-arrow-l" aria-hidden="true"></span>
          <span class="dpad-arrow dpad-arrow-r" aria-hidden="true"></span>
          <span class="dpad-notch" aria-hidden="true"></span>
        </div>
      </div>
      <div class="gb-face">
        <button type="button" class="gb-face-btn gb-b" id="btn-b">B</button>
        <button type="button" class="gb-face-btn gb-a" id="btn-jump-p">A</button>
      </div>
    </div>
    <div class="gb-system">
      <button type="button" class="gb-sys-btn" id="btn-pause-p">
        <span class="gb-sys-pill"></span>
        <span class="gb-sys-label">START</span>
      </button>
    </div>
    <div class="gb-footer">
      <button type="button" class="gb-menu-dot" id="btn-menu" title="Mute">🔊</button>
      <span style="width:28px;height:28px;opacity:0.35;color:#fff;font-size:18px;line-height:28px;text-align:center;">P</span>
    </div>
  </div>
</div>

<script>

'use strict';

// Prevent zoom gestures globally on touch devices
document.addEventListener('gesturestart', function (e) {
  e.preventDefault();
});

let lastTouchEnd = 0;
document.addEventListener('touchend', function (e) {
  const now = (new Date()).getTime();
  if (now - lastTouchEnd <= 300) {
    e.preventDefault();
  }
  lastTouchEnd = now;
}, false);

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = true;
ctx.imageSmoothingQuality = 'high';

function buildGroundRects(){
  const sorted = [...GAPS].sort((a,b)=>a[0]-b[0]);
  const rects = [];
  let cursor = 0;
  for(const [gs,ge] of sorted){
    if(gs>cursor) rects.push({x:cursor,y:GROUND_Y,w:gs-cursor,h:(GAME_H-GROUND_Y)+40});
    cursor = ge;
  }
  if(cursor<WORLD_LEN) rects.push({x:cursor,y:GROUND_Y,w:WORLD_LEN-cursor,h:(GAME_H-GROUND_Y)+40});
  return rects;
}
let GROUND_RECTS = buildGroundRects();
let STATIC_SOLIDS = GROUND_RECTS.concat(PLATFORM_TEMPLATE);

function applyLevel(lvl){
  WORLD_LEN = lvl.worldLen;
  GAPS = lvl.gaps;
  PLATFORM_TEMPLATE = lvl.platforms.map(p => ({
    ...p,

    movePhase: Math.random() * Math.PI * 2,
    moveDir: 1
  }));
  ENEMY_TEMPLATE = lvl.enemies;
  FLAG_X = lvl.flagX;
  GROUND_RECTS = buildGroundRects();
  STATIC_SOLIDS = GROUND_RECTS.concat(PLATFORM_TEMPLATE);

function makeBallRow(p,count,gap,yOff){
  const arr = [];
  const startX = p.x + (p.w-(count-1)*gap)/2;
  for(let i=0;i<count;i++) arr.push({x:startX+i*gap, y:p.y-yOff, taken:false, plat:p, offX:(startX+i*gap)-p.x, offY:-yOff});
  return arr;
}
function buildBalls(){
  let balls = [];
  // sparse: 1 ball per platform (2 on longer ones)
  for(const p of PLATFORM_TEMPLATE){
    const n = p.w > 48 ? 2 : 1;
    balls = balls.concat(makeBallRow(p, n, 16, 16));
  }
  return balls;
}

function pointerToGame(e){
  const rect = canvas.getBoundingClientRect();
  const scale = Math.min(rect.width / GAME_W, rect.height / GAME_H);
  const drawW = GAME_W * scale, drawH = GAME_H * scale;
  const offsetX = (rect.width - drawW) / 2, offsetY = (rect.height - drawH) / 2;
  return {
    x: (e.clientX - rect.left - offsetX) / scale,
    y: (e.clientY - rect.top - offsetY) / scale
  };
}

/* audio */
let audioCtx = null;
function ensureAudio(){
  if(!audioCtx){
    try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }
    catch(e){ return; }
  }
  if(audioCtx.state==='suspended') audioCtx.resume();
}
function tone(freq,dur,type,vol,delay){
  if(muted || !audioCtx) return;
  type = type || 'sine'; vol = vol || 0.12; delay = delay || 0;
  const t0 = audioCtx.currentTime + delay;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq,t0);
  gain.gain.setValueAtTime(0,t0);
  gain.gain.linearRampToValueAtTime(vol,t0+0.012);
  gain.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(t0); osc.stop(t0+dur+0.03);
}

  jump: ()=>{ tone(560,0.09,'sine',0.1); tone(840,0.11,'sine',0.08,0.05); },

  stomp: ()=>{ tone(220,0.1,'sine',0.14); tone(160,0.12,'sine',0.1,0.06); },

};

/* physics */
function moveAndCollide(ent,dt,solids){
  ent.onGround = false;

  // ---- horizontal: sub-stepped so a sliding platform can't sweep through us ----
  const hDist = Math.abs(ent.vx*dt);
  const hSteps = Math.max(1, Math.min(8, Math.ceil(hDist/4)));
  const hsdt = dt/hSteps;
  for(let s=0; s<hSteps; s++){
    const prevX = ent.x;
    ent.x += ent.vx*hsdt;
    ent.x = clamp(ent.x, 0, WORLD_LEN-ent.w);
    for(const r of solids){
      // only a "wall" if there's real vertical overlap (more than resting-on-top contact)
      if(ent.y + ent.h <= r.y + 2 || ent.y >= r.y + r.h) continue;
      const dx = r._dx || 0;
      const leftPrev = r.x - dx, rightPrev = leftPrev + r.w;
      if(ent.vx>0 && (prevX + ent.w <= r.x + 1 || prevX + ent.w <= leftPrev + 1) && ent.x + ent.w > r.x){ ent.x = r.x - ent.w; ent.vx = 0; }
      else if(ent.vx<0 && (prevX >= r.x + r.w - 1 || prevX >= rightPrev - 1) && ent.x < r.x + r.w){ ent.x = r.x + r.w; ent.vx = 0; }
      else if(dx !== 0 && ent.vx === 0 && ent.x + ent.w > r.x && ent.x < r.x + r.w){
        // standing still while a platform slides into us: get pushed, not swallowed
        if(dx > 0) ent.x = r.x - ent.w; else ent.x = r.x + r.w;
      }
    }
  }

  // ---- vertical: true swept test, independent of frame speed, so no fall can ever tunnel ----
  const prevY = ent.y;
  const targetY = ent.y + ent.vy*dt;
  if(ent.vy >= 0){
    const prevBottom = prevY + ent.h;
    const targetBottom = targetY + ent.h;
    let landOnY = null;
    for(const r of solids){
      if(ent.x + ent.w <= r.x + 0.01 || ent.x >= r.x + r.w - 0.01) continue; // no horizontal overlap
      const dy = r._dy || 0;
      const topPrev = r.y - dy;
      // Our feet started at/above the platform's top (this frame's or last frame's position)
      // and end at/below it — that's a crossing no matter how far we moved this frame.
      const crossedTop = (prevBottom <= r.y + 1 && targetBottom >= r.y - 0.5) ||
                          (prevBottom <= topPrev + 1 && targetBottom >= topPrev - 0.5);
      // A platform rising fast (dy<0) can swallow us from below even if we weren't falling into it.
      const liftedInto = dy < 0 && targetBottom >= r.y - 0.5 && targetBottom <= r.y + 10;
      if(crossedTop || liftedInto){
        if(landOnY === null || r.y < landOnY) landOnY = r.y;
      }
    }
    if(landOnY !== null){ ent.y = landOnY - ent.h; ent.vy = 0; ent.onGround = true; }
    else { ent.y = targetY; }
  } else {
    const prevTop = prevY;
    const targetTop = targetY;
    let ceilY = null;
    for(const r of solids){
      if(ent.x + ent.w <= r.x + 0.01 || ent.x >= r.x + r.w - 0.01) continue;
      const bottom = r.y + r.h;
      if(prevTop >= bottom - 1 && targetTop <= bottom + 0.5){
        if(ceilY === null || bottom > ceilY) ceilY = bottom;
      }
    }
    if(ceilY !== null){ ent.y = ceilY; ent.vy = 0; }
    else { ent.y = targetY; }
  }
}

function checkLedgeGrab(plats){
  if(player.onGround || player.isLedgeHanging || player.isClimbing) return;
  if(player.vy <= 0) return; // only while falling

  for(const r of plats){
    const vertOK = (player.y >= r.y - 6 && player.y <= r.y + 10);
    if(!vertOK) continue;

    if(input.right && Math.abs((player.x + player.w) - r.x) <= 7){
      player.isLedgeHanging = true;
      player.facing = 1;
      player.x = r.x - player.w + 3;
      player.y = r.y;
      player.vx = 0;
      player.vy = 0;
      player.ledgePlatform = r;
      player.ledgeSide = 'left';
      break;
    }
    if(input.left && Math.abs(player.x - (r.x + r.w)) <= 7){
      player.isLedgeHanging = true;
      player.facing = -1;
      player.x = r.x + r.w - 3;
      player.y = r.y;
      player.vx = 0;
      player.vy = 0;
      player.ledgePlatform = r;
      player.ledgeSide = 'right';
      break;
    }
  }
}

function addPopup(x,y,text,color){ popups.push({x,y,text,color:color||COLORS.gold,life:0.9,maxLife:0.9}); }
function spawnParticles(x,y,count,color){
  for(let i=0;i<count;i++){
    particles.push({
      x, y,
      vx:(Math.random()-0.5)*90,
      vy:-Math.random()*90-20,
      life:0.5, maxLife:0.5, color
    });
  }
}
function triggerShake(mag){ shakeTimer = SHAKE_DURATION; shakeMag = mag; }
function findSafeSpawn(x){
  let best = null;
  for(const r of GROUND_RECTS){
    if(x + PLAYER_W > r.x + 4 && x < r.x + r.w - 4){ best = r; break; }
  }
  if(!best){
    for(let i = GROUND_RECTS.length - 1; i >= 0; i--){
      const r = GROUND_RECTS[i];
      if(r.x + r.w <= x + PLAYER_W){ best = r; break; }
    }
  }
  if(!best && GROUND_RECTS.length) best = GROUND_RECTS[0];
  if(best){
    const sx = clamp(x, best.x + 4, best.x + best.w - PLAYER_W - 4);
    return { x: sx, y: best.y - PLAYER_H - 2 };
  }
  return { x: 24, y: GROUND_Y - PLAYER_H - 2 };
}
function loseLife(){
  lives--;
  if(lives<=0){ state='gameover'; menuLock = 0.7; SFX.gameover(); saveBest(); return; }
  const spawn = findSafeSpawn(checkpointX);
  player.x = spawn.x; player.y = spawn.y;
  player.vx = 0; player.vy = 0;
  player.isLedgeHanging = false; player.isClimbing = false;
  player.ledgePlatform = null;
  player.invuln = 1.4;
  camX = clamp(player.x + player.w/2 - GAME_W/2, 0, Math.max(0, WORLD_LEN - GAME_W));
  SFX.hurt(); triggerShake(4);
}

/* loop */
function update(dt){
  elapsed += dt;

  if(state==='sliding'){
    player.y += SLIDE_SPEED*dt;
    if(player.y >= GROUND_Y-player.h){
      player.y = GROUND_Y-player.h;
      state = 'win';
      menuLock = 0.7;
      score += Math.floor(timeLeft)*10;
      addPopup(player.x+player.w/2, player.y-10, 'TIME BONUS!', COLORS.gold);
      saveBest();
      SFX.win();
      player.squashAmt = 0.4;
      spawnParticles(player.x+player.w/2, player.y+player.h, 8, '#FFFFFF');
    }
    return;
  }
  if(state!=='playing') return;

  timeLeft = Math.max(0, timeLeft-dt);
  if(timeLeft <= 0){
    timeLeft = getLevel().timeLimit;
    loseLife();
    if(state !== 'playing') return;
  }

  // --- moving platforms ---
  for(const p of PLATFORM_TEMPLATE){
    if(!p.moveAxis) continue;
    const prevX = p.x, prevY = p.y;
    if(p.moveAxis === 'x'){
      p.x += p.moveDir * p.moveSpeed * dt;
      if(p.x <= p.moveMin){ p.x = p.moveMin; p.moveDir = 1; }
      if(p.x + p.w >= p.moveMax){ p.x = p.moveMax - p.w; p.moveDir = -1; }
    } else {
      p.y += p.moveDir * p.moveSpeed * dt;
      if(p.y <= p.moveMin){ p.y = p.moveMin; p.moveDir = 1; }
      if(p.y >= p.moveMax){ p.y = p.moveMax; p.moveDir = -1; }
    }
    p._dx = p.x - prevX;
    p._dy = p.y - prevY;
  }
  // rebuild solids with live platform positions
  STATIC_SOLIDS = GROUND_RECTS.concat(PLATFORM_TEMPLATE);

  // carry player if standing on a moving platform
  if(player.onGround && !player.isLedgeHanging && !player.isClimbing){
    for(const p of PLATFORM_TEMPLATE){
      if(!p.moveAxis) continue;
      const feet = player.y + player.h;
      if(Math.abs(feet - p.y) < 3 &&
         player.x + player.w > p.x + 2 && player.x < p.x + p.w - 2){
        player.x += (p._dx || 0);
        player.y += (p._dy || 0);
        break;
      }
    }
  }

  const solids = STATIC_SOLIDS;

  player.squashAmt *= Math.exp(-dt*11);

  if(player.isClimbing){
    player.vx = 0;
    player.vy = 0;
    player.climbTimer += dt;
    const t = Math.min(1, player.climbTimer / player.climbDuration);

    if(t < 0.5){
      const e = smoothstep(t/0.5);
      player.x = lerp(player.climbFrom.x, player.climbMid.x, e);
      player.y = lerp(player.climbFrom.y, player.climbMid.y, e);
    } else {
      const e = smoothstep((t-0.5)/0.5);
      player.x = lerp(player.climbMid.x, player.climbTo.x, e);
      player.y = lerp(player.climbMid.y, player.climbTo.y, e);
    }

    if(t>=1){
      player.x = player.climbTo.x;
      player.y = player.climbTo.y;
      player.isClimbing = false;
      player.onGround = true;
      player.squashAmt = 0.3;
    }
  } else if(player.isLedgeHanging){
    player.vx = 0;
    player.vy = 0;

    // stay locked to the platform edge (works for moving platforms)
    if(player.ledgePlatform){
      const r = player.ledgePlatform;
      if(player.ledgeSide === 'left') player.x = r.x - player.w + 3;
      else player.x = r.x + r.w - 3;
      player.y = r.y;
    }

    if(jumpQueued || input.up){
      if(player.ledgePlatform){
        const r = player.ledgePlatform;
        const finalX = player.ledgeSide === 'left' ? r.x + 2 : r.x + r.w - player.w - 2;
        const finalY = r.y - player.h;
        player.climbFrom = { x: player.x, y: player.y };
        player.climbMid = { x: player.x, y: r.y - player.h - 5 };
        player.climbTo = { x: finalX, y: finalY };
        player.climbTimer = 0;
        player.isClimbing = true;
      }
      player.isLedgeHanging = false;
      jumpQueued = false;
      SFX.jump();
    } else if(input.down){
      if(player.ledgePlatform){
        if(player.ledgeSide === 'left') player.x = player.ledgePlatform.x - player.w - 1;
        else player.x = player.ledgePlatform.x + player.ledgePlatform.w + 1;
      }
      player.isLedgeHanging = false;
      player.ledgePlatform = null;
      player.vy = 80;
    }
  } else {
    const accel = MOVE_ACCEL * (player.onGround ? 1 : AIR_CONTROL);
    const wasOnGround = player.onGround;

    if(input.left && !input.right){ player.vx -= accel*dt; player.facing = -1; }
    else if(input.right && !input.left){ player.vx += accel*dt; player.facing = 1; }
    else{
      if(player.vx>0) player.vx = Math.max(0, player.vx-FRICTION*dt);
      else if(player.vx<0) player.vx = Math.min(0, player.vx+FRICTION*dt);
    }
    player.vx = clamp(player.vx,-MAX_SPEED,MAX_SPEED);

    if(Math.abs(player.vx) > 8 && player.onGround){
      player.runPhase += dt * (8 + Math.abs(player.vx)/MAX_SPEED*10);
    }

    if(player.onGround) coyoteTimer = COYOTE_TIME;
    else coyoteTimer = Math.max(0, coyoteTimer-dt);

    if(jumpQueued){ jumpBufferTimer = JUMP_BUFFER; jumpQueued = false; }
    jumpBufferTimer = Math.max(0, jumpBufferTimer - dt);
    if(jumpBufferTimer>0){
      if(coyoteTimer>0){
        player.vy = -JUMP_SPEED; coyoteTimer = 0; SFX.jump();
        player.squashAmt = -0.35;
        jumpBufferTimer = 0;
      }
    }

    player.prevFeet = player.y + player.h;
    const preVY = player.vy;
    player.vy = Math.min(MAX_FALL, player.vy + GRAVITY*(player.vy>0?FALL_MULT:1)*dt);

    moveAndCollide(player, dt, solids);
    checkLedgeGrab(PLATFORM_TEMPLATE);

    if(!wasOnGround && player.onGround){
      const impact = clamp(preVY/JUMP_SPEED, 0, 1.4);
      player.squashAmt = 0.28 + impact*0.35;
      if(impact>0.5) spawnParticles(player.x+player.w/2, player.y+player.h, 4, '#FFFFFF');
    }
  }

  if(player.invuln>0) player.invuln = Math.max(0, player.invuln-dt);
  // only save checkpoint when standing on solid ground (not a floating platform over a gap)
  if(player.onGround && !player.isLedgeHanging && !player.isClimbing){
    for(const r of GROUND_RECTS){
      if(Math.abs((player.y + player.h) - r.y) < 4 &&
         player.x + player.w > r.x + 2 && player.x < r.x + r.w - 2){
        checkpointX = Math.max(checkpointX, player.x - 6);
        break;
      }
    }
  }

  for(const c of coins){
    if(c.plat && c.plat.moveAxis){ c.x = c.plat.x + c.offX; c.y = c.plat.y + c.offY; }
  }

  for(const en of enemies){
    if(!en.alive){ en.deathTimer -= dt; continue; }
    const typ = en.type || 'cloud';

    if(typ === 'bee'){
      // fly in a horizontal wave
      en.x += en.dir * en.speed * dt;
      if(en.x < en.minX){ en.x = en.minX; en.dir = 1; }
      if(en.x + en.w > en.maxX){ en.x = en.maxX - en.w; en.dir = -1; }
      en.hopPhase = (en.hopPhase || 0) + dt * 4.5;
      const baseY = en._baseY != null ? en._baseY : (en._baseY = en.y);
      en.y = baseY + Math.sin(en.hopPhase) * 14;
    } else if(typ === 'duck'){
      en.x += en.dir * en.speed * dt;
      if(en.x < en.minX){ en.x = en.minX; en.dir = 1; }
      if(en.x + en.w > en.maxX){ en.x = en.maxX - en.w; en.dir = -1; }
      en.hopPhase = (en.hopPhase || 0) + dt * 7;
      const baseY = en._baseY != null ? en._baseY : (en._baseY = en.y);
      en.y = baseY - Math.abs(Math.sin(en.hopPhase)) * 12;
    } else if(typ === 'urchin'){
      en.x += en.dir * en.speed * dt;
      if(en.x < en.minX){ en.x = en.minX; en.dir = 1; }
      if(en.x + en.w > en.maxX){ en.x = en.maxX - en.w; en.dir = -1; }
      // slight pulse
      en.hopPhase = (en.hopPhase || 0) + dt * 3;
    } else {
      // cloud (default)
      en.x += en.dir * en.speed * dt;
      if(en.x < en.minX){ en.x = en.minX; en.dir = 1; }
      if(en.x + en.w > en.maxX){ en.x = en.maxX - en.w; en.dir = -1; }
      if(en.hop){
        en.hopPhase = (en.hopPhase || 0) + dt * 6;
        const baseY = en._baseY != null ? en._baseY : (en._baseY = en.y);
        en.y = baseY - Math.abs(Math.sin(en.hopPhase)) * 10;
      }
    }

    if(rectsOverlap(player, en)){
      const canStomp = typ !== 'urchin';
      const feetNow = player.y + player.h;
      const feetBefore = (player.prevFeet != null ? player.prevFeet : feetNow);
      const stomping = player.vy > 0 && (feetBefore <= en.y + 4 || feetNow <= en.y + en.h*0.6);
      if(canStomp && stomping){
        en.alive = false; en.deathTimer = 0.3;
        player.vy = -JUMP_SPEED * 0.55;
        player.squashAmt = -0.3;
        score += (typ === 'duck' ? 150 : 100);
        addPopup(en.x+en.w/2, en.y, typ==='duck'?'+150':'+100', '#FFFFFF');
        spawnParticles(en.x+en.w/2, en.y+en.h/2, 8, '#FFFFFF');
        SFX.stomp();
      } else if(player.invuln <= 0){
        lives--;
        if(lives <= 0){ state='gameover'; menuLock = 0.7; SFX.gameover(); saveBest(); return; }
        else{
          player.invuln = 1.3;
          player.isLedgeHanging = false;
          player.isClimbing = false;
          player.vx = -player.facing * 110;
          player.vy = -240;
          SFX.hurt(); triggerShake(4);
        }
      }
    }
  }
  enemies = enemies.filter(en => en.alive || en.deathTimer > 0);

  for(const c of coins){
    if(c.taken) continue;
    const ballRect = {x:c.x-6,y:c.y-6,w:12,h:12};
    if(rectsOverlap(player,ballRect)){
      c.taken = true; coinCount++; score += 10;
      addPopup(c.x, c.y-8, '+10');
      spawnParticles(c.x,c.y,6,COLORS.gold);
      SFX.coin();
    }
  }


  if(score>=nextLifeScore){ lives++; nextLifeScore += 2000; }
  if(player.y>GAME_H+30){ loseLife(); }

  if(state==='playing' && player.x+player.w>=FLAG_X){
    state = 'sliding';
    player.x = FLAG_X + 1 - player.w/2;
    player.y = clamp(player.y, POLE_TOP, GROUND_Y-player.h);
    const grabHeight = clamp((GROUND_Y - player.h - player.y) / (GROUND_Y - player.h - POLE_TOP), 0, 1);
    const heightBonus = Math.round(grabHeight*1000/50)*50;
    if(heightBonus>0){ score += heightBonus; addPopup(player.x+player.w/2, player.y-8, '+'+heightBonus, COLORS.gold); }
    player.vx = 0; player.vy = 0;
    player.isLedgeHanging = false; player.isClimbing = false;
    SFX.jump();
  }

  for(const p of particles){
    p.x += p.vx*dt; p.y += p.vy*dt; p.vy += 260*dt; p.life -= dt;
  }
  particles = particles.filter(p=>p.life>0);
  for(const q of popups){ q.y -= 26*dt; q.life -= dt; }
  popups = popups.filter(q=>q.life>0);

  // running dust
  if(player.onGround && Math.abs(player.vx) > 60 && Math.random() < dt*18){
    particles.push({x:player.x+player.w/2, y:player.y+player.h, vx:-player.facing*30*Math.random(), vy:-20*Math.random(), life:0.3, maxLife:0.3, color:'#FFFFFF'});
  }

  const lookAhead = clamp(player.vx/MAX_SPEED, -1, 1) * 40;
  const targetCam = clamp(player.x+player.w/2-GAME_W/2+lookAhead, 0, Math.max(0, WORLD_LEN-GAME_W));
  camX += (targetCam-camX) * Math.min(1, dt*7);

  if(shakeTimer>0) shakeTimer = Math.max(0, shakeTimer-dt);
}

/* render */
function drawGameText(text,x,y,opts){
  opts = opts || {};
  const size = opts.size || 10;
  const color = opts.color || COLORS.text;
  const shadow = opts.shadow!==undefined ? opts.shadow : 'rgba(43,35,64,0.25)';
  const align = opts.align || 'left';
  ctx.font = (opts.weight || '700') + ' ' + size + "px 'Baloo 2', Verdana, sans-serif";
  ctx.textAlign = align;
  ctx.textBaseline = 'alphabetic';
  if(shadow){ ctx.fillStyle = shadow; ctx.fillText(text, x+1.5, y+1.5); }
  ctx.fillStyle = color;
  ctx.fillText(text, x, y);
}

function drawSky(){
  const g = ctx.createLinearGradient(0,0,0,GAME_H);
  g.addColorStop(0, COLORS.skyTop);
  g.addColorStop(0.55, COLORS.skyMid);
  g.addColorStop(1, COLORS.skyBottom);
  ctx.fillStyle = g;
  ctx.fillRect(0,0,GAME_W,GAME_H);

  const night = !!window.__levelNight;

  if(night){
    // stars
    ctx.save();
    ctx.translate(Math.round(-camX*0.03), 0);
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    const stars = [[40,22],[90,48],[140,18],[200,55],[250,28],[310,42],[370,15],[430,50],[490,25],[560,38],[620,20],[700,45],[780,30],[860,18],[940,52],[1020,24],[1100,40],[1180,16],[1260,48],[1340,28],[1420,36],[1500,20],[1600,44],[1700,26],[1800,50],[1900,18],[2000,42],[2100,30],[2200,22],[2300,48],[2400,16],[2500,38],[2600,28],[2700,46],[2800,20],[2900,34],[3000,24]];
    for(const [sx,sy] of stars){
      const tw = 0.55 + 0.45*Math.sin(elapsed*2.2 + sx*0.07);
      ctx.globalAlpha = tw;
      ctx.beginPath();
      ctx.arc(sx, sy, (sx%3===0)?1.4:1.0, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.restore();

    // crescent moon
    const mx = 390, my = 42;
    ctx.save();
    ctx.translate(-camX*0.02, 0);
    ctx.fillStyle = 'rgba(255,250,220,0.95)';
    ctx.beginPath(); ctx.arc(mx, my, 14, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = COLORS.skyTop;
    ctx.beginPath(); ctx.arc(mx+6, my-3, 12, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  } else {
    // sun
    const sunX = 400, sunY = 46;
    ctx.save();
    ctx.translate(-camX*0.02, 0);
    const glow = ctx.createRadialGradient(sunX,sunY,4,sunX,sunY,40);
    glow.addColorStop(0, COLORS.sunGlow);
    glow.addColorStop(1, 'rgba(255,209,0,0)');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(sunX,sunY,40,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = COLORS.sun;
    ctx.beginPath(); ctx.arc(sunX,sunY,18,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }

  // drifting clouds (dimmer at night)
  ctx.save();
  ctx.translate(Math.round(-camX*0.06), 0);
  if(night) ctx.globalAlpha = 0.45;
  const cloudDefs = [[60,40,1],[260,60,0.8],[520,35,1.1],[760,55,0.9],[1020,42,1],[1300,60,0.85],[1560,38,1.05],[1900,50,0.9],[2250,40,1],[2500,58,0.85],[2800,45,0.95]];
  for(const [cx0,cy0,s] of cloudDefs){
    const cx = cx0, cy = cy0 + Math.sin(elapsed*0.4+cx0)*2;
    drawPuffCloud(cx,cy,s);
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

function drawPuffCloud(cx,cy,s){
  ctx.fillStyle = COLORS.cloudWhite;
  ctx.beginPath();
  ctx.arc(cx-14*s, cy+4*s, 11*s, 0, Math.PI*2);
  ctx.arc(cx, cy-4*s, 15*s, 0, Math.PI*2);
  ctx.arc(cx+15*s, cy+3*s, 12*s, 0, Math.PI*2);
  ctx.arc(cx+2*s, cy+7*s, 13*s, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = COLORS.cloudShade;
  ctx.beginPath();
  ctx.arc(cx-10*s, cy+9*s, 8*s, 0, Math.PI*2);
  ctx.arc(cx+10*s, cy+9*s, 8*s, 0, Math.PI*2);
  ctx.fill();
}

function drawBackgroundHills(){
  ctx.save();
  ctx.translate(Math.round(-camX*0.18), 0);
  ctx.fillStyle = COLORS.hillFar;
  drawHillBand(GAME_H-58, 70, 0.010, 1);
  ctx.restore();

  ctx.save();
  ctx.translate(Math.round(-camX*0.35), 0);
  ctx.fillStyle = COLORS.hillNear;
  drawHillBand(GAME_H-42, 46, 0.016, 2);
  ctx.restore();
}
function drawHillBand(baseY,amp,freq,seed){
  ctx.beginPath();
  ctx.moveTo(-100, GAME_H+20);
  for(let x=-100;x<=WORLD_LEN*1.4;x+=20){
    const y = baseY - Math.abs(Math.sin(x*freq+seed))*amp;
    ctx.lineTo(x,y);
  }
  ctx.lineTo(WORLD_LEN*1.4, GAME_H+20);
  ctx.closePath();
  ctx.fill();
}

function drawGround(){
  for(const r of GROUND_RECTS){
    if(r.x+r.w<camX-20 || r.x>camX+GAME_W+20) continue;
    const drawH = Math.min(r.h, GAME_H-r.y+40);

    ctx.fillStyle = COLORS.dirt;
    ctx.fillRect(r.x, r.y+9, r.w, drawH);
    ctx.fillStyle = COLORS.dirtDark;
    for(let x=Math.ceil((r.x+6)/26)*26; x<r.x+r.w-4; x+=26){
      ctx.fillRect(x, r.y+20, 10, 6);
    }

    ctx.fillStyle = COLORS.grassEdge;
    ctx.fillRect(r.x, r.y+5, r.w, 8);
    ctx.fillStyle = COLORS.grassTop;
    ctx.fillRect(r.x, r.y, r.w, 8);

    // crisp top outline so the ground reads clearly against the sky/hills
    ctx.fillStyle = 'rgba(43,35,64,0.4)';
    ctx.fillRect(r.x, r.y-1, r.w, 2);

    // grass tufts
    ctx.fillStyle = COLORS.grassTop;
    for(let x=r.x+4; x<r.x+r.w-4; x+=11){
      const h = 4 + ((x*7)%3);
      ctx.beginPath();
      ctx.moveTo(x, r.y);
      ctx.lineTo(x+3, r.y-h);
      ctx.lineTo(x+6, r.y);
      ctx.fill();
    }
  }
}

function getBlockColors(){
  return [
    [COLORS.block1, COLORS.block1d],
    [COLORS.block2, COLORS.block2d],
    [COLORS.block3, COLORS.block3d],
    [COLORS.block4, COLORS.block4d]
  ];
}
function drawPlatforms(){
  const BLOCK_COLORS = getBlockColors();
  PLATFORM_TEMPLATE.forEach((p,i)=>{
    if(p.x+p.w<camX-20 || p.x>camX+GAME_W+20) return;
    const [main,dark] = BLOCK_COLORS[i%BLOCK_COLORS.length];
    const rad = 6;

    // moving platforms get a thin support pole (like the reference art)
    const overSolidGround = GROUND_RECTS.some(g => (p.x + p.w/2) > g.x && (p.x + p.w/2) < g.x + g.w);
    if(p.moveAxis && overSolidGround){
      const cx = p.x + p.w/2;
      ctx.fillStyle = 'rgba(43,35,64,0.35)';
      ctx.fillRect(cx-1.5, p.y + p.h, 3, Math.max(8, GROUND_Y - p.y - p.h));
      // little top knob
      ctx.beginPath(); ctx.arc(cx, p.y + p.h + 2, 3, 0, Math.PI*2);
      ctx.fillStyle = dark; ctx.fill();
    }

    roundRect(p.x, p.y, p.w, p.h, rad);
    ctx.fillStyle = dark;
    ctx.fill();
    roundRect(p.x, p.y, p.w, p.h-3, rad);
    ctx.fillStyle = main;
    ctx.fill();

    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    roundRect(p.x+4, p.y+2, p.w-8, 3, 2);
    ctx.fill();

    ctx.fillStyle = dark;
    const dotY = p.y + p.h/2 + 1;
    for(let x=p.x+8; x<p.x+p.w-4; x+=14){
      ctx.beginPath(); ctx.arc(x, dotY, 1.6, 0, Math.PI*2); ctx.fill();
    }
  });
}
function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function drawBall(x,y){
  ctx.save();
  ctx.translate(x,y);
  const r = 6;
  ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.fillStyle='#fff'; ctx.fill();
  const wedges = [COLORS.danger, COLORS.gold, COLORS.block4, COLORS.block3];
  for(let i=0;i<wedges.length;i++){
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.arc(0,0,r, (Math.PI/2)*i, (Math.PI/2)*(i+1));
    ctx.closePath();
    ctx.fillStyle = wedges[i];
    ctx.fill();
  }
  ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2);
  ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(43,35,64,0.35)'; ctx.stroke();
  ctx.beginPath(); ctx.arc(-2,-2,1.6,0,Math.PI*2);
  ctx.fillStyle='rgba(255,255,255,0.85)'; ctx.fill();
  ctx.restore();
}

function drawBalls(){
  for(const c of coins){
    if(c.taken) continue;
    if(c.x<camX-20 || c.x>camX+GAME_W+20) continue;
    // gentle bob + soft squash so they read as hovering, not bouncing
    const bobY = Math.sin(elapsed*2.2 + c.x)*1.6;
    const spin = Math.abs(Math.sin(elapsed*2+c.x*0.1));
    ctx.save();
    ctx.translate(c.x, c.y+bobY);
    ctx.scale(0.85+spin*0.15, 1);
    ctx.translate(-c.x,-(c.y+bobY));
    drawBall(c.x, c.y+bobY);
    ctx.restore();
  }
}


function drawPopups(){
  for(const q of popups){
    ctx.globalAlpha = Math.max(0, Math.min(1, q.life/q.maxLife));
    drawGameText(q.text, q.x, q.y, {size:9, align:'center', color:q.color, weight:'800'});
  }
  ctx.globalAlpha = 1;
}
function drawParticles(){
  for(const p of particles){
    ctx.globalAlpha = Math.max(0, p.life/p.maxLife);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x,p.y,1.8,0,Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

/* grumpy clouds */
function drawCloudFace(w,h,mood){
  const rW = w/2;
  ctx.fillStyle = COLORS.cloudBody;
  ctx.beginPath();
  ctx.arc(-rW*0.55, -h*0.15, rW*0.55, 0, Math.PI*2);
  ctx.arc(0, -h*0.42, rW*0.62, 0, Math.PI*2);
  ctx.arc(rW*0.55, -h*0.15, rW*0.55, 0, Math.PI*2);
  ctx.arc(0, 0, rW*0.68, 0, Math.PI*2);
  ctx.fill();

  ctx.fillStyle = COLORS.cloudBodyD;
  ctx.beginPath();
  ctx.ellipse(-rW*0.32, h*0.14, rW*0.22,h*0.12,0,0,Math.PI*2);
  ctx.ellipse(rW*0.32, h*0.14, rW*0.22,h*0.12,0,0,Math.PI*2);
  ctx.fill();

  // eyes
  ctx.fillStyle = COLORS.ink;
  ctx.beginPath();
  ctx.ellipse(-rW*0.28,-h*0.08,1.6,2.1,0,0,Math.PI*2);
  ctx.ellipse(rW*0.28,-h*0.08,1.6,2.1,0,0,Math.PI*2);
  ctx.fill();

  // angry eyebrows
  ctx.strokeStyle = COLORS.ink;
  ctx.lineWidth = 1.6;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-rW*0.46,-h*0.28); ctx.lineTo(-rW*0.14,-h*0.18);
  ctx.moveTo(rW*0.46,-h*0.28); ctx.lineTo(rW*0.14,-h*0.18);
  ctx.stroke();

  // frown
  ctx.beginPath();
  ctx.arc(0, h*0.12, rW*0.28, Math.PI*1.15, Math.PI*1.85);
  ctx.stroke();
}
function drawBee(w,h){
  // body
  ctx.fillStyle = '#FFD100';
  ctx.beginPath(); ctx.ellipse(0, 0, w*0.42, h*0.38, 0, 0, Math.PI*2); ctx.fill();
  // stripes
  ctx.fillStyle = '#2B2340';
  ctx.fillRect(-w*0.12, -h*0.32, w*0.1, h*0.64);
  ctx.fillRect(w*0.08, -h*0.32, w*0.1, h*0.64);
  // head
  ctx.fillStyle = '#2B2340';
  ctx.beginPath(); ctx.arc(-w*0.38, 0, w*0.22, 0, Math.PI*2); ctx.fill();
  // eyes
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(-w*0.42, -2, 2.2, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(-w*0.32, -2, 2.2, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#2B2340';
  ctx.beginPath(); ctx.arc(-w*0.42, -2, 1, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(-w*0.32, -2, 1, 0, Math.PI*2); ctx.fill();
  // wings
  ctx.globalAlpha = 0.55;
  ctx.fillStyle = '#E6F7FF';
  const wingFlap = Math.sin(elapsed * 18) * 0.25;
  ctx.beginPath(); ctx.ellipse(-2, -h*0.55 + wingFlap*4, w*0.28, h*0.22, -0.4, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(6, -h*0.55 - wingFlap*4, w*0.28, h*0.22, 0.4, 0, Math.PI*2); ctx.fill();
  ctx.globalAlpha = 1;
  // antennae
  ctx.strokeStyle = '#2B2340'; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(-w*0.45,-h*0.15); ctx.lineTo(-w*0.55,-h*0.45); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-w*0.35,-h*0.15); ctx.lineTo(-w*0.28,-h*0.45); ctx.stroke();
  ctx.fillStyle = '#2B2340';
  ctx.beginPath(); ctx.arc(-w*0.55,-h*0.45,1.5,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(-w*0.28,-h*0.45,1.5,0,Math.PI*2); ctx.fill();
}

function drawDuck(w,h){
  // body
  ctx.fillStyle = '#FFD100';
  ctx.beginPath(); ctx.ellipse(0, 2, w*0.45, h*0.38, 0, 0, Math.PI*2); ctx.fill();
  // head
  ctx.beginPath(); ctx.arc(-w*0.28, -h*0.15, w*0.28, 0, Math.PI*2); ctx.fill();
  // beak
  ctx.fillStyle = '#F7941D';
  ctx.beginPath();
  ctx.moveTo(-w*0.5, -h*0.12);
  ctx.lineTo(-w*0.72, -h*0.05);
  ctx.lineTo(-w*0.5, 2);
  ctx.closePath(); ctx.fill();
  // eye
  ctx.fillStyle = '#2B2340';
  ctx.beginPath(); ctx.arc(-w*0.35, -h*0.22, 2, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(-w*0.38, -h*0.24, 0.8, 0, Math.PI*2); ctx.fill();
  // wing
  ctx.fillStyle = '#E8B800';
  ctx.beginPath(); ctx.ellipse(w*0.1, 2, w*0.22, h*0.18, 0.3, 0, Math.PI*2); ctx.fill();
  // feet
  ctx.fillStyle = '#F7941D';
  ctx.fillRect(-4, h*0.35, 3, 4);
  ctx.fillRect(2, h*0.35, 3, 4);
}

function drawUrchin(w,h){
  const pulse = 1 + Math.sin((arguments[2]||0) * 3) * 0.06;
  // spikes
  ctx.fillStyle = '#9B6FD1';
  for(let i=0;i<8;i++){
    const a = (i/8)*Math.PI*2 + elapsed*0.5;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a)*w*0.15, Math.sin(a)*h*0.15);
    ctx.lineTo(Math.cos(a-0.2)*w*0.55*pulse, Math.sin(a-0.2)*h*0.55*pulse);
    ctx.lineTo(Math.cos(a+0.2)*w*0.55*pulse, Math.sin(a+0.2)*h*0.55*pulse);
    ctx.closePath(); ctx.fill();
  }
  // body
  ctx.fillStyle = '#7E52B5';
  ctx.beginPath(); ctx.arc(0, 0, w*0.38, 0, Math.PI*2); ctx.fill();
  // angry face
  ctx.fillStyle = '#2B2340';
  ctx.beginPath(); ctx.ellipse(-w*0.12, -2, 2.2, 2.8, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(w*0.12, -2, 2.2, 2.8, 0, 0, Math.PI*2); ctx.fill();
  // frown
  ctx.strokeStyle = '#2B2340'; ctx.lineWidth = 1.4; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(0, 4, w*0.18, Math.PI*0.15, Math.PI*0.85); ctx.stroke();
}

function drawEnemies(){
  for(const en of enemies){
    if(en.x<camX-30 || en.x>camX+GAME_W+30) continue;
    const dying = !en.alive;
    const squishY = dying ? Math.max(0.15, en.deathTimer/0.3) : 1;
    const typ = en.type || 'cloud';
    ctx.save();
    ctx.translate(en.x+en.w/2, en.y+en.h);

    let scaleX = en.dir > 0 ? -1 : 1;
    const bob = dying ? 0 : Math.sin(elapsed*5 + en.x)*1.0;
    ctx.translate(0, bob);
    ctx.scale(scaleX, squishY);
    if(dying) ctx.globalAlpha = Math.max(0, en.deathTimer/0.3);

    ctx.translate(0, -en.h/2 - 2);
    if(typ === 'bee'){
      drawBee(18, 16);
    } else if(typ === 'duck'){
      drawDuck(18, 16);
    } else if(typ === 'urchin'){
      drawUrchin(16, 16, en.hopPhase);
    } else {
      const sz = en.hop ? 24 : 22;
      drawCloudFace(sz, sz*0.82);
    }

    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

/* sprite */
function drawPlayerSpriteAt(x, y, facing){
  ctx.save();
  ctx.translate(x, y);

  let scaleX = facing < 0 ? 1 : -1;
  const sq = player.squashAmt;
  const scaleY = 1 - sq*0.5;
  const scaleXAdj = 1 + sq*0.5;

  let frame = 0;
  const moving = Math.abs(player.vx) > 8 && player.onGround;
  let bobY = 0;
  if(moving){
    frame = Math.floor(player.runPhase) % RUN_FRAMES;
  } else {
    frame = 0;
    bobY = Math.sin(elapsed*2.4)*1;
  }

  ctx.translate(0, bobY);
  ctx.scale(scaleX*scaleXAdj, scaleY);

  const drawH = SPRITE_H;
  const drawW = drawH * (RUN_FW/RUN_FH);
  ctx.drawImage(runSheetImg, frame*RUN_FW, 0, RUN_FW, RUN_FH, -drawW/2, -drawH, drawW, drawH);

  ctx.restore();
}

function drawJumpSpriteAt(x, y, facing, falling){
  ctx.save();
  ctx.translate(x, y);

  let scaleX = facing < 0 ? -1 : 1;
  const sq = player.squashAmt;
  let scaleY = 1 - sq*0.5;
  let scaleXAdj = 1 + sq*0.5;
  const rot = facing * -0.1;

  if(falling){
    const pulse = Math.sin(elapsed*7) * 0.07;
    scaleY *= 1 + pulse;
    scaleXAdj *= 1 - pulse;
  }

  ctx.scale(scaleX*scaleXAdj, scaleY);
  ctx.rotate(rot);

  const drawH = SPRITE_H * 1.06;
  const drawW = drawH * (158/220);
  ctx.drawImage(jumpImg, -drawW/2, -drawH, drawW, drawH);

  ctx.restore();
}

function drawHangingSpriteAt(x, y, facing, sway){
  sway = sway===undefined ? true : sway;
  ctx.save();
  ctx.translate(x, y);

  let scaleX = facing < 0 ? -1 : 1;
  ctx.scale(scaleX, 1);

  const dangle = sway ? (Math.sin(elapsed * 2.4) * 0.09 + Math.sin(elapsed * 1.15) * 0.03) : 0;
  ctx.rotate(dangle);

  // Scaled to match run sprite size; arm raised high — anchor near hand tip
  const drawH = SPRITE_H * 0.92;
  const drawW = drawH * (212/282);

  const handOffsetX = -drawW * 0.55;
  const handOffsetY = -3 + (sway ? Math.sin(elapsed * 2.4 + 0.6) * 0.7 : 0);

  ctx.drawImage(hangImg, handOffsetX, handOffsetY, drawW, drawH);

  ctx.restore();
}

function drawSlideSpriteAt(x, y, facing){
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(facing < 0 ? -1 : 1, 1);
  ctx.rotate(Math.sin(elapsed*9)*0.03);
  const drawH = SPRITE_H * 1.05;
  const drawW = drawH * (158/220);
  // hands hug the pole: shift body slightly to the side of the pole
  ctx.drawImage(slideImg, -drawW*0.62, -drawH, drawW, drawH);
  ctx.restore();
}

function drawPlayer(){
  if(state==='sliding'){
    drawSlideSpriteAt(player.x + player.w/2, player.y + player.h, 1);
    return;
  }
  if(player.invuln > 0 && Math.floor(elapsed * 14) % 2 === 0) return;
  if(player.isClimbing){
    const t = player.climbTimer / player.climbDuration;
    if(t < 0.55){
      drawHangingSpriteAt(player.x + player.w/2, player.y, player.facing);
    } else {
      drawPlayerSpriteAt(player.x + player.w/2, player.y + player.h, player.facing);
    }
  } else if(player.isLedgeHanging){
    drawHangingSpriteAt(player.x + player.w/2, player.y, player.facing);
  } else if(!player.onGround){
    drawJumpSpriteAt(player.x + player.w/2, player.y + player.h, player.facing, player.vy > 0);
  } else {
    drawPlayerSpriteAt(player.x + player.w/2, player.y + player.h, player.facing);
  }
}

function drawHUD(){
  roundRect(6,4,150,24,10);
  ctx.fillStyle = 'rgba(255,247,230,0.85)';
  ctx.fill();
  drawGameText('SCORE '+String(score).padStart(6,'0'), 14, 21, {size:11, align:'left', color:COLORS.ink});

  roundRect(162,4,74,24,10);
  ctx.fillStyle = 'rgba(255,247,230,0.85)';
  ctx.fill();
  drawBall(178,16);
  drawGameText('x'+coinCount, 190, 21, {size:11, align:'left', color:COLORS.ink});


  roundRect(GAME_W-190,4,100,24,10);
  ctx.fillStyle = 'rgba(255,247,230,0.85)';
  ctx.fill();
  drawGameText('LIVES x'+lives, GAME_W-182, 21, {size:11, align:'left', color:COLORS.danger});

  roundRect(GAME_W-84,4,78,24,10);
  ctx.fillStyle = 'rgba(255,247,230,0.85)';
  ctx.fill();
  drawGameText('⏱ '+Math.ceil(timeLeft), GAME_W-12, 21, {size:11, align:'right', color:COLORS.ink});

  // level indicator
  roundRect(GAME_W-190,30,100,18,8);
  ctx.fillStyle = 'rgba(255,247,230,0.75)';
  ctx.fill();
  drawGameText('LEVEL '+currentLevel+'/'+TOTAL_LEVELS, GAME_W-140, 43, {size:9, align:'center', color:COLORS.ink});
}

function drawOverlay(alpha){
  ctx.fillStyle = 'rgba(20,20,40,'+alpha+')';
  ctx.fillRect(0,0,GAME_W,GAME_H);
}

function drawStartScreen(){
  drawOverlay(0.4);
  const bob = Math.sin(elapsed*2.4)*4;
  drawPlayerSpriteAt(GAME_W/2, 150+bob, 1);
  drawGameText("POCOYO'S", GAME_W/2, 62, {size:26, align:'center', color:COLORS.gold, weight:'800'});
  drawGameText('SUNNY ADVENTURE', GAME_W/2, 88, {size:16, align:'center', color:'#fff', weight:'700'});
  if(Math.floor(elapsed*2)%2===0){
    drawGameText('TAP OR PRESS SPACE TO PLAY', GAME_W/2, 200, {size:11, align:'center', color:'#fff'});
  }
  drawGameText('ARROWS / TOUCH MOVE  ·  SPACE JUMP  ·  UP GRABS LEDGES', GAME_W/2, 225, {size:8, align:'center', color:'#E6F7FF'});
  drawGameText('HOP ON CLOUDS, DUCKS & BEES  ·  NEVER TOUCH SPIKY URCHINS', GAME_W/2, 240, {size:8, align:'center', color:'#E6F7FF'});
}

function drawPauseOverlay(){
  drawOverlay(0.45);
  drawGameText('PAUSED', GAME_W/2, 130, {size:22, align:'center', color:'#fff'});
  drawGameText('PRESS P OR TAP PAUSE TO RESUME', GAME_W/2, 155, {size:10, align:'center', color:'#E6F7FF'});
}

function drawGameOverScreen(){
  drawOverlay(0.55);
  drawGameText('OH NO!', GAME_W/2, 100, {size:26, align:'center', color:COLORS.danger, weight:'800'});
  drawGameText('SCORE '+String(score).padStart(6,'0'), GAME_W/2, 135, {size:13, align:'center', color:'#fff'});
  drawGameText('BEST '+String(bestScore).padStart(6,'0'), GAME_W/2, 152, {size:10, align:'center', color:COLORS.gold});
  if(Math.floor(elapsed*2)%2===0){
    drawGameText('TAP OR PRESS SPACE TO TRY AGAIN', GAME_W/2, 172, {size:10, align:'center', color:'#fff'});
  }
}

function drawWinScreen(){
  drawOverlay(0.35);
  const bounce = Math.abs(Math.sin(elapsed*3.2))*14;
  if(currentLevel < TOTAL_LEVELS){
    drawGameText('LEVEL '+currentLevel+' CLEAR!', GAME_W/2, 55, {size:20, align:'center', color:COLORS.gold, weight:'800'});
    drawGameText('GET READY FOR LEVEL '+(currentLevel+1), GAME_W/2, 80, {size:12, align:'center', color:'#fff'});
  } else {
    drawGameText('YAY! YOU DID IT!', GAME_W/2, 35, {size:16, align:'center', color:COLORS.gold, weight:'800'});
    drawGameText('ALL LEVELS COMPLETE!', GAME_W/2, 52, {size:10, align:'center', color:'#fff'});
    drawGameText('HAPPY BIRTHDAY MARSH!', GAME_W/2, 72, {size:13, align:'center', color:COLORS.gold, weight:'800'});
    drawGameText('THANK YOU FOR BEING OUR FRIEND', GAME_W/2, 88, {size:9, align:'center', color:'#fff'});
  }
  drawPlayerSpriteAt(GAME_W/2, 175-bounce, 1);
  if(currentLevel < TOTAL_LEVELS){
    drawGameText('SCORE '+String(score).padStart(6,'0'), GAME_W/2, 100, {size:14, align:'center', color:'#fff'});
    drawGameText('BEST '+String(bestScore).padStart(6,'0'), GAME_W/2, 118, {size:10, align:'center', color:COLORS.gold});
  } else {
    drawGameText('SCORE '+String(score).padStart(6,'0'), GAME_W/2, 200, {size:12, align:'center', color:'#fff'});
    drawGameText('BEST '+String(bestScore).padStart(6,'0'), GAME_W/2, 216, {size:9, align:'center', color:COLORS.gold});
  }
  if(Math.floor(elapsed*2)%2===0){
    const msg = currentLevel < TOTAL_LEVELS ? 'TAP OR PRESS SPACE FOR NEXT LEVEL' : 'TAP OR PRESS SPACE TO PLAY AGAIN';
    drawGameText(msg, GAME_W/2, 245, {size:9, align:'center', color:'#fff'});
  }

  // (FOR MARSH ONLY) button on final win screen
  if(currentLevel >= TOTAL_LEVELS){
    const btnW = 120, btnH = 22, btnX = GAME_W - btnW - 10, btnY = GAME_H - btnH - 8;
    ctx.fillStyle = 'rgba(244,115,158,0.92)';
    roundRect(btnX, btnY, btnW, btnH, 10); ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; roundRect(btnX, btnY, btnW, btnH, 10); ctx.stroke();
    drawGameText('(FOR MARSH ONLY)', btnX + btnW/2, btnY + 16, {size:10, align:'center', color:'#fff', weight:'800'});
  }

  // Secret message overlay
  if(showMarshMessage){
    drawOverlay(0.85);
    drawGameText('FOR MARSH', GAME_W/2, 40, {size:18, align:'center', color:COLORS.gold, weight:'800'});
    const lines = [
      'Hallo gng, i know what im boutta do or say rn is an A hole move, pls dont be mad,',
      'but, gusto ko lang na malaman mo, although hindi halata, gusto parin kita, thats all,',
      'i know, we had a big problems, gusto ko lang tlgang sabihan ka para lang alam mo,',
      'dw tho im not expecting you to do anything abt this, idk if you like someone rn or',
      'someones tryna court you but im not particularly asking to court you js sayin'
    ];
    let y = 70;
    for(const line of lines){
      drawGameText(line, GAME_W/2, y, {size:9, align:'center', color:'#fff'});
      y += 18;
    }
    if(Math.floor(elapsed*2)%2===0){
      drawGameText('TAP ANYWHERE TO CLOSE', GAME_W/2, 220, {size:10, align:'center', color:COLORS.gold});
    }
  }
}

function render(){
  ctx.imageSmoothingEnabled = true;
  ctx.clearRect(0,0,GAME_W,GAME_H);

  drawSky();
  drawBackgroundHills();

  ctx.save();
  const shk = shakeTimer>0 ? (shakeTimer/SHAKE_DURATION) : 0;
  const shakeX = shk ? (Math.random()-0.5)*shakeMag*shk : 0;
  const shakeY = shk ? (Math.random()-0.5)*shakeMag*shk*0.6 : 0;
  ctx.translate(Math.round(-camX+shakeX), Math.round(shakeY));

  drawGround();
  drawPlatforms();
  drawFlag();
  drawBalls();

  drawParticles();
  drawEnemies();
  drawPlayer();
  drawPopups();
  ctx.restore();

  drawHUD();

  if(state==='start') drawStartScreen();
  else if(state==='paused') drawPauseOverlay();
  else if(state==='gameover') drawGameOverScreen();
  else if(state==='win') drawWinScreen();
}

function drawFlag(){
  const poleTop = POLE_TOP;
  ctx.fillStyle = '#E7B96E';
  ctx.fillRect(FLAG_X-1, poleTop, 4, GROUND_Y-poleTop);
  ctx.fillStyle = '#D1A052';
  ctx.fillRect(FLAG_X+1, poleTop, 2, GROUND_Y-poleTop);

  // pinwheel
  const spin = elapsed*3.4;
  const cx = FLAG_X+1, cy = poleTop-2;
  const wheelColors = [COLORS.block2, COLORS.block4, COLORS.block1, COLORS.gold];
  ctx.save();
  ctx.translate(cx,cy);
  ctx.rotate(spin);
  for(let i=0;i<4;i++){
    ctx.save();
    ctx.rotate(i*Math.PI/2);
    ctx.fillStyle = wheelColors[i];
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.quadraticCurveTo(6,-2,9,6);
    ctx.quadraticCurveTo(2,6,0,0);
    ctx.fill();
    ctx.restore();
  }
  ctx.restore();
  ctx.fillStyle = COLORS.ink;
  ctx.beginPath(); ctx.arc(cx,cy,2,0,Math.PI*2); ctx.fill();
}

/* main loop */
let lastTime = 0;
function loop(ts){
  if(!lastTime) lastTime = ts;
  let dt = (ts-lastTime)/1000;
  lastTime = ts;
  if(!(dt > 0) || dt > 0.25) dt = 1/60;
  dt = Math.min(dt, 0.033);
  menuLock = Math.max(0, menuLock - dt);
  update(dt);
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

})();
</script>
